<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form inputs</title>
    <style>
      button {
        background-color: #4caf50;
        color: white;
        padding: 14px 16px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border: none;
        outline: none;
        border-radius: 4px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
      }
      .form-group label{
        font-size: small;
        color: #555;
      }
      .form-group input{
        padding: 12px 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <header></header>
    <nav></nav>
    <main>
      <h1>HTML Form Inputs</h1>
      <form
        action=""
        method="post"
        style="display: flex; flex-direction: column; gap: 1rem"
      >
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" name="username" id="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" name="password" id="password">
        </div>
        <!-- radio buttons -->
        <div>
          <input type="radio" name="man" id="man" value="man" />
          <label for="man">Man</label>
          <input type="radio" name="woman" id="woman" value="woman" />
          <label for="woman">Woman</label>
        </div>
        <div>
          <input type="checkbox" name="oranges" id="oranges" value="oranges" />
          <label for="oranges">I like oranges</label>
          <input type="checkbox" name="apples" id="apples" value="apples" />
          <label for="apples">I like apples</label>
        </div>
        <div>
          <button type="submit">Submit</button>
          <button onclick="alert('Are you sure you want to continue?')">
            Click Me  
          </button>
        </div>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
