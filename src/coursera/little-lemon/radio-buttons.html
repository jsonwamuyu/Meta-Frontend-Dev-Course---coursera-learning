<!doctype html>
<html lang="en">
  <head>
    <title>Little Lemon</title>

    <meta property="og:title" content="Our Menu" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="logo.png" />
    <meta property="og:url" content="https://littlelemon/" />
    <meta
      property="og:description"
      content="Little Lemon is a family-owned Mediterranean restaurant, focused on traditional recipes served with a modern twist."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Little Lemon" />

    <link rel="stylesheet" href="styles.css" />
    <style>
      form {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .form-group label {
        font-size: small;
        color: #555;
      }
      .form-group input {
        padding: 12px 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        outline: none;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="logo.png" />
    </header>
    <main>
      <h1>Book a table</h1>
      <form action="" method="POST">
        <div class="form-group">
          <label for="booking_date">Booking Date</label>
          <input type="date" name="booking_date" id="booking_date" />
        </div>
        <div class="form-group">
          <label for="booking_people">Number of People</label>
          <div style="display: flex; align-items: center; gap: 8px">
            <input
              type="range"
              name="booking_people"
              id="booking_people"
              min="1"
              max="10"
              value="2"
              oninput="this.nextElementSibling.value = this.value"
            />
            <output>2</output>
          </div>
        </div>
        <div class="form-group">
          <label for="booking_location">Location</label>
          <input
            id="booking_location"
            name="booking_location"
            list="locations"
          />
          <datalist id="locations">
            <option value="Downtown">Downtown</option>
            <option value="Uptown"></option>
            <option value="Suburbs"></option>
          </datalist>
        </div>
        <div class="form-group">
          <label for="country">Country</label>
          <select name="country" id="country">
            <option value="" disabled selected>Select Country</option>
            <option value="Kenya">Kenya</option>
            <option value="Uganda">Uganda</option>
            <option value="Tanzania">Tanzania</option>
          </select>
        </div>
        <div>
          <button
            type="submit"
            style="
              background-color: rgb(7, 233, 7);
              color: white;
              padding: 10px 14px;
              border: none;
              outline: none;
              border-radius: 4px;
              cursor: pointer;
              margin-top: 1rem;
            "
          >
            Book table
          </button>
        </div>
      </form>

        <fieldset id="size">
          <label for="size-2">
            <input type="radio" name="size" value="2" id="size-2" />2-person
            table</label
          >

          <label for="size-4">
            <input
              type="radio"
              name="size"
              value="4"
              id="size-4"
              checked
            />4-person table</label
          >
          <label for="size-6">

          >
        </fieldset>
        <fieldset id="location">
          <input type="radio" name="location" value="indoor" checked />Indoor

        </fieldset>
        <button type="submit">Book table</button>
      </form> -->
    </main>
  </body>
</html>
