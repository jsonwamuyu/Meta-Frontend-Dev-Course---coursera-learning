<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Lemon</title>
    <style>
      form input {
        width: full;
        padding: 10px 14px;
        border-radius: 4px;
        border: 1px solid #ccc;
        outline: none;
      }
      input:focus:invalid {
        border: 1px solid red;
        color: red;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.875rem;
      }
      form label {
        color: rgb(71, 71, 71);
        font-size: small;
      }
      button {
        background-color: rgb(112, 1, 192);
        color: whitesmoke;
        padding: 10px 14px;
        border-radius: 0.25rem;
        border: none;
        outline: none;
        cursor: pointer;
      }
      .copy-rights {
        font-size: small;
        color: rgb(114, 114, 114);
      }
      .booking {
        width: full;
      }
      @media (min-width: 42.375rem) {
        .booking {
          max-width: 30rem;
        }
      }
      .container {
        margin: 0 auto;
        max-width: 1124px;
        padding-left: 1rem;
        padding-right: 1rem;
      }
    </style>
  </head>
  <body>
    <header></header>
    <nav></nav>
    <main class="contain">
      <section class="booking">
        <h1>Book a table</h1>
        <form action="" method="POST">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Email Address"
              required
            />
          </div>
          <div class="form-group">
            <label for="booking_date">Booking Date</label>
            <input type="date" name="booking_date" id="booking_date" required />
          </div>
          <div class="form-group">
            <label for="no_people">Number of people</label>
            <input type="number" min="1" max="8" required />
          </div>
          <div class="">
            <input type="checkbox" id="policy" name="policy" required />
            <label for="policy">Agree to <a href="">terms</a> and policy</label>
          </div>
          <div>
            <button type="submit">Book Now</button>
          </div>
        </form>
      </section>
    </main>
    <footer>
      <p class="copy-rights">&copy;2026, Copyrights Little Lemon</p>
    </footer>
  </body>
</html>
